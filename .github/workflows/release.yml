name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de versión (ej. v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # Full history and tags: the release notes list the commits since the previous tag

      - name: Setup MSVC developer prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure Release Preset
        run: cmake --preset release

      - name: Build Release Preset
        run: cmake --build --preset release

      - name: Run Tests (Release)
        run: ctest --preset release --output-on-failure

      - name: Determine Version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v[0-9]') {
            $tag = "${{ github.event.inputs.tag_name }}"
          }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = "v0.1.0"
          }
          Write-Host "Releasing version: $tag"
          echo "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Package Release Artifacts
        shell: pwsh
        run: |
          .\scripts\package_release.ps1 -Version "${{ steps.version.outputs.tag }}"

      # After packaging, so the notes embed the checksums of the published artifacts.
      - name: Generate Release Notes
        shell: pwsh
        run: |
          .\scripts\generate_release_notes.ps1 -Version "${{ steps.version.outputs.tag }}"
          if (-not (Select-String -Path dist/RELEASE_NOTES.md -SimpleMatch "# Pluma ${{ steps.version.outputs.tag }}" -Quiet)) {
            throw "dist/RELEASE_NOTES.md was not generated for ${{ steps.version.outputs.tag }}"
          }

      # The release body is always dist/RELEASE_NOTES.md, never GitHub's auto-generated notes.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Pluma ${{ steps.version.outputs.tag }}
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: false
          draft: false
          prerelease: false

      - name: Verify Published Release Notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $body = gh release view $tag --repo "${{ github.repository }}" --json body --jq .body | Out-String
          $zipHash = ((Get-Content dist/SHA256SUMS.txt | Where-Object { $_ -match '\.zip$' }) -split '\s+')[0]
          if (-not $body.Contains("# Pluma $tag") -or -not $body.Contains($zipHash)) {
            throw "The published body of release $tag does not match dist/RELEASE_NOTES.md"
          }
          Write-Host "Release notes of $tag are published."
